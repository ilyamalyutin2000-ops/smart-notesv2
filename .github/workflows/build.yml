name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    # Используем актуальную версию (ubuntu-22.04 отключают)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Ставим Python 3.9
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 2. Ставим Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Системные зависимости (для новой Ubuntu)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libstdc++6

      # 4. Устанавливаем Buildozer и Cython (0.29.33 обязателен)
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer Cython==0.29.33 virtualenv

      # 5. Полная очистка перед сборкой
      - name: Clean everything
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf bin
          rm -rf .buildozer/android/platform/python-for-android

      # 6. Запуск сборки с автоответом
      - name: Build with Buildozer
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          export BUILDOZER_WARN_ON_ROOT=0
          yes | buildozer android debug

      # 7. Загрузка APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-notes-apk
          path: bin/*.apk
